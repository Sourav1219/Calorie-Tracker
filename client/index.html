<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="PureIntake — Track your calories, meals, water intake and nutrition goals with a beautiful, easy-to-use interface." />
    <meta name="theme-color" content="#f9fafb" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts without blocking render: fetch as a non-blocking preload,
         then flip to a stylesheet once ready (display=swap avoids invisible text). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" /></noscript>
    <title>PureIntake — Calorie Tracker</title>
    <script>
      // Apply saved/system theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <!-- Inline splash so first paint happens at HTML-parse time (instant FCP),
         instead of waiting for the JS bundle to download + execute. Styled
         inline so it doesn't depend on the (separately loaded) CSS bundle.
         React replaces #root's contents on mount, removing this automatically. -->
    <style>
      #initial-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f9fafb; }
      html.dark #initial-splash { background: #0b1120; }
      #initial-splash > span { width: 40px; height: 40px; border: 4px solid rgba(125,140,170,0.25); border-top-color: #22c55e; border-radius: 50%; animation: initial-splash-spin 0.8s linear infinite; }
      @keyframes initial-splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="initial-splash"><span></span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
